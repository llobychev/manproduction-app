<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f1b2d">
  <title>MenClub V2 Development</title>
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js" defer></script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app-shell" data-lifecycle="booting">
    <header class="app-header" id="app-header">
      <button class="icon-button header-back" id="header-back" type="button" aria-label="Назад" hidden>←</button>
      <div class="header-copy">
        <span class="brand-mark" id="header-brand">MENCLUB</span>
        <h1 id="header-title">Главная</h1>
        <p id="header-subtitle">V2 Development · foundation</p>
      </div>
      <button class="icon-button" id="header-action" type="button" aria-label="Уведомления">●</button>
    </header>

    <button id="access-banner" class="access-banner" type="button" hidden></button>

    <main id="route-outlet" class="route-outlet" tabindex="-1" aria-live="polite"></main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Основная навигация">
      <button type="button" data-route="home"><span aria-hidden="true">⌂</span><small>Главная</small></button>
      <button type="button" data-route="lyova.chat" class="lyova-nav"><span aria-hidden="true">Л</span><small>Лёва</small></button>
      <button type="button" data-route="events.list"><span aria-hidden="true">▣</span><small>События</small></button>
      <button type="button" data-route="path.home"><span aria-hidden="true">⚑</span><small>Путь</small></button>
      <button type="button" data-route="widgets.home"><span aria-hidden="true">▦</span><small>Виджеты</small></button>
      <button type="button" data-route="profile.cabinet"><span aria-hidden="true">●</span><small>Профиль</small></button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="lifecycle-root" class="lifecycle-overlay" role="status" aria-live="polite"></div>
  <div id="status-announcer" class="sr-only" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
